name: Daily Kanpo Digest to Discord

on:
  schedule:
    # 毎朝 日本時間 8:00 (UTC 23:00) に自動実行
    - cron: '0 23 * * *'
  workflow_dispatch: # 手動実行トリガー

jobs:
  kanpo-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Kanpo Digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python kanpo_discord_digest.py
